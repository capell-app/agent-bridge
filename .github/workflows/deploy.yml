name: Deploy Capell MCP

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

jobs:
  dispatch:
    name: Trigger Capell app deployment
    runs-on: ubuntu-latest
    env:
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.DEPLOY_DISPATCH_TOKEN }}
    steps:
      - name: Prepare deployment payload
        id: payload
        uses: actions/github-script@v9
        with:
          script: |
            const payload = {
              source: context.repo.repo,
              ref: context.ref,
              sha: context.sha,
            };

            if (context.eventName === 'release') {
              payload.tag = context.ref.replace('refs/tags/', '');
              payload.release_url = context.payload.release.html_url;
            }

            core.setOutput('json', JSON.stringify(payload));
            core.info(`Prepared capell-mcp deploy payload: ${JSON.stringify(payload)}`);

      - name: Trigger Capell app deploy workflow
        uses: actions/github-script@v9
        with:
          github-token: ${{ env.DEPLOY_DISPATCH_TOKEN }}
          script: |
            if (!process.env.DEPLOY_DISPATCH_TOKEN) {
              core.setFailed('Missing ACCESS_TOKEN or DEPLOY_DISPATCH_TOKEN secret.');
              return;
            }

            const payload = JSON.parse(`${{ steps.payload.outputs.json }}`);

            await github.rest.actions.createWorkflowDispatch({
              owner: 'capell-app',
              repo: 'capell-app',
              workflow_id: 'deploy.yml',
              ref: 'main',
            });

            core.info(`Triggered capell-app deploy for ${payload.source}@${payload.ref}`);
